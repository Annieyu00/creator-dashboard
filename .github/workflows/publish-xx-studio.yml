name: Build and publish XX Studio
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/publish-xx-studio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xx-studio-publish
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build production app
        working-directory: app
        run: npm run build
      - name: Update GitHub Pages files only after successful build
        run: |
          cp -a app/dist/. ./
          cp app/legacy-checkin.html legacy-checkin.html
          mkdir -p data
          test -f data/douyin.json || cp app/data/douyin.json data/douyin.json
          test -f data/xiaohongshu.json || cp app/data/xiaohongshu.json data/xiaohongshu.json
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets legacy-checkin.html data .nojekyll
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Publish compiled XX Studio to GitHub Pages" && git push; fi
