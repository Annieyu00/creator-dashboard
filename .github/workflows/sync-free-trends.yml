name: Sync free Douyin & Xiaohongshu trends
on:
  workflow_dispatch:
  schedule:
    # Every 6 hours (UTC). GitHub schedules are best-effort and may be delayed.
    - cron: '17 0,6,12,18 * * *'
permissions:
  contents: write
concurrency:
  group: free-trends-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate free hotboards
        run: python scripts/sync_free_trends.py
      - name: Commit only real data snapshots
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/douyin.json data/xiaohongshu.json
          if git diff --cached --quiet; then
            echo "No trend data changes"
          else
            git commit -m "Update free daily Douyin and Xiaohongshu trends"
            git push
          fi
